<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nightingale — Sunway Women's Health</title>
    <style>
      :root {
        --sage: #5f7a6a;
        --cream: #faf7f2;
        --bubble-me: #5f7a6a;
        --bubble-them: #eee7db;
        --ink: #2b2b28;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--cream);
        color: var(--ink);
      }
      header {
        padding: 14px 18px;
        background: var(--sage);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #a8e6b0;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      #thread {
        flex: 1;
        padding: 14px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bubble {
        max-width: 78%;
        padding: 9px 13px;
        border-radius: 16px;
        line-height: 1.35;
        font-size: 14.5px;
      }
      .them {
        align-self: flex-start;
        background: var(--bubble-them);
      }
      .me {
        align-self: flex-end;
        background: var(--bubble-me);
        color: #fff;
      }
      .meta {
        font-size: 11px;
        color: #9a9187;
        margin: 2px 4px;
        align-self: flex-start;
      }
      .citation {
        font-size: 11px;
        color: #8a8a86;
        margin-top: 3px;
        font-style: italic;
      }
      .value-chip {
        align-self: flex-start;
        background: #fff3d6;
        border: 1px solid #eadca0;
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 13px;
        cursor: pointer;
      }
      .escalate-btn {
        align-self: flex-start;
        background: #c85c5c;
        color: #fff;
        padding: 8px 14px;
        border-radius: 10px;
        border: none;
        font-size: 13.5px;
        cursor: pointer;
      }
      footer {
        padding: 10px 14px 14px;
        border-top: 1px solid #eee;
      }
      .emergency {
        font-size: 11.5px;
        color: #9c4a4a;
        text-align: center;
        margin-bottom: 8px;
      }
      .inputrow {
        display: flex;
        gap: 8px;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 20px;
        font-size: 14px;
      }
      button.send {
        background: var(--sage);
        color: #fff;
        border: none;
        border-radius: 20px;
        padding: 0 18px;
        font-size: 14px;
      }
      #trustBar {
        display: flex;
        justify-content: center;
        padding: 8px;
        font-size: 12px;
      }
      #trustBar a {
        color: var(--sage);
      }
      .drawer {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        background: #fbfaf7;
        border-left: 1px solid #eee;
        padding: 16px;
        transform: translateX(100%);
        transition: 0.25s;
        overflow-y: auto;
      }
      .drawer.open {
        transform: translateX(0);
      }
      .drawerClose {
        float: right;
        border: none;
        background: transparent;
        font-size: 24px;
        cursor: pointer;
        line-height: 1;
      }
      .drawer h3 {
        margin-top: 0;
        font-size: 15px;
      }
      .fact {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 8px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .fact .status {
        float: right;
        font-size: 11px;
        color: #888;
      }
      #profileToggle {
        position: fixed;
        right: 14px;
        top: 14px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 16px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .signupCard {
        background: #f4f1ea;
        border-radius: 12px;
        padding: 14px;
        margin: 10px 0;
        font-size: 13.5px;
      }
      #signupCard label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 13px;
        line-height: 1.4;
        margin-top: 8px;
      }

      #signupCard label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        margin: 2px 0 0;
      }
      .signupCard input:not([type="checkbox"]) {
        width: 100%;
        margin: 5px 0;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .signupCard button {
        margin-top: 6px;
        width: 100%;
        padding: 9px;
        background: var(--sage);
        color: #fff;
        border: none;
        border-radius: 8px;
      }
      .consent-option {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 13px;
        line-height: 1.4;
        margin-top: 8px;
      }

      .consent-option input[type="checkbox"] {
        width: 16px;
        height: 16px;
        min-width: 16px;
        margin: 2px 0 0;
      }
      #staffView {
        max-width: 760px;
        margin: 24px auto;
        padding: 24px;
        font-size: 14px;
        background: #f7faf7;
        border: 1px solid #e1eae3;
        border-radius: 14px;
        box-shadow: 0 3px 12px rgba(43, 70, 55, 0.06);
      }
      #staffView h2 {
        margin: 0 0 20px;
        color: #3f5f4d;
        font-size: 21px;
        font-weight: 650;
        letter-spacing: -0.2px;
      }
      .leadrow {
        border: 1px solid #e1e8e2;
        border-radius: 10px;
        padding: 12px 14px;
        margin: 8px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: #fff;
      }
      .staff-section {
        margin-top: 20px;
        padding: 16px;
        background: #fff;
        border: 1px solid #e1e8e2;
        border-radius: 12px;
      }
      .section-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .section-heading h3 {
        margin: 0;
        color: #3f5f4d;
        font-size: 15px;
      }
      .section-heading span {
        font-size: 11px;
        color: #8a968d;
      }
      .section-note {
        margin: 5px 0 12px;
        font-size: 12px;
        color: #7b837d;
      }
      .compassion-row button {
        flex-shrink: 0;
        padding: 7px 11px;
        border: 1px solid #6f8d79;
        border-radius: 7px;
        background: #edf4ee;
        color: #3f5f4d;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .compassion-row button:hover {
        background: #e2eee5;
      }
      .compassion-row button:disabled {
        background: #f0f2f0;
        border-color: #d9ded9;
        color: #8a918b;
        cursor: default;
      }
      #staffView input {
        padding: 9px 11px;
        border: 1px solid #d8e2da;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        outline: none;
      }
      #staffView input:focus {
        border-color: var(--sage);
        box-shadow: 0 0 0 2px rgba(95, 122, 106, 0.12);
      }
      .staff-login-btn {
        padding: 9px 18px;
        border: 1px solid #4f6f5b;
        border-radius: 8px;
        background: #5f7a6a;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }
      .staff-login-btn:hover {
        background: #4f6f5b;
      }
      .staff-login-btn:active {
        transform: translateY(1px);
      }
      nav.tabs {
        text-align: center;
        padding: 8px;
        font-size: 12px;
      }
      nav.tabs a {
        margin: 0 8px;
        color: var(--sage);
        text-decoration: none;
      }
      @media (max-width: 600px) {
        #staffView {
          margin: 12px;
          padding: 16px;
        }
        #staffView > div:first-of-type {
          display: flex;
          flex-direction: column;
          gap: 7px;
        }
        #staffView input,
        .staff-login-btn {
          width: 100%;
        }
        .leadrow {
          align-items: flex-start;
        }
        .compassion-row {
          flex-direction: column;
        }
        .compassion-row button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav class="tabs">
      <a href="#" onclick="showView('chat')">Patient / Guest</a> ·
      <a href="#" onclick="showView('staff')">Staff view</a>
    </nav>

    <main id="chatView">
      <header>
        <div class="dot"></div>
        Nightingale — Sunway Women's Health
      </header>
      <div id="trustBar">
        <a href="#" onclick="askTrust()">Is this a real doctor?</a>
      </div>
      <div id="thread"></div>
      <footer>
        <div class="emergency">
          If this is an emergency, exit Nightingale and dial 999 for Emergency
          Services.
        </div>
        <div class="inputrow">
          <input
            id="msgInput"
            type="text"
            placeholder="Type a message…"
            onkeydown="if (event.key === 'Enter') sendMsg();"
          />
          <button class="send" onclick="sendMsg()">Send</button>
        </div>
      </footer>
    </main>
    <button id="profileToggle" onclick="toggleDrawer()" style="display: none">
      Profile
    </button>
    <div class="drawer" id="drawer">
      <button onclick="toggleDrawer()" class="drawerClose">×</button>
      <h3>Your profile</h3>
      <div id="factList"></div>
    </div>

    <div id="staffView" style="display: none">
      <h2>Warm leads & compassion queue</h2>
      <div>
        <input id="staffName" placeholder="staff name (try: dr_lim)" />
        <input
          id="staffPass"
          placeholder="password (demo1234)"
          type="password"
        />
        <button class="staff-login-btn" onclick="staffLogin()">Log in</button>
      </div>
      <div id="compassionBox"></div>
      <div id="leadsBox"></div>
    </div>

    <script>
      let leadId = null,
        patientSessionId = null,
        patientToken = null,
        staffToken = null,
        lastTrigger = null;

      function showView(v) {
        document.getElementById("chatView").style.display =
          v === "chat" ? "flex" : "none";
        document.getElementById("staffView").style.display =
          v === "staff" ? "block" : "none";
      }
      function addBubble(text, who, meta, citation) {
        const t = document.getElementById("thread");
        if (meta) {
          const m = document.createElement("div");
          m.className = "meta";
          m.textContent = meta;
          t.appendChild(m);
        }
        const b = document.createElement("div");
        b.className = "bubble " + (who === "me" ? "me" : "them");
        b.textContent = text;
        t.appendChild(b);
        if (citation) {
          const c = document.createElement("div");
          c.className = "citation";
          c.textContent = "Source: " + citation;
          t.appendChild(c);
        }
        t.scrollTop = t.scrollHeight;
      }

      (async function start() {
        const savedPatientToken = localStorage.getItem(
          "nightingale_patient_token",
        );
        const savedPatientSessionId = localStorage.getItem(
          "nightingale_patient_session_id",
        );

        if (savedPatientToken && savedPatientSessionId) {
          patientToken = savedPatientToken;
          patientSessionId = savedPatientSessionId;
        }
        const params = new URLSearchParams(window.location.search);
        const referralToken = params.get("ref");
        const existingLeadId = params.get("lead");

        if (existingLeadId) {
          const r = await fetch(
            `/api/lead/${encodeURIComponent(existingLeadId)}`,
          );

          if (!r.ok) {
            addBubble(
              "This conversation link is no longer available. You can still start a new conversation with me.",
              "them",
            );
            return;
          }

          const d = await r.json();
          leadId = d.lead_session_id;

          addBubble(
            "Welcome back. We can continue from where you left off.",
            "them",
          );
          return;
        }

        if (referralToken) {
          const r = await fetch(
            `/api/lead/from-referral/${encodeURIComponent(referralToken)}`,
          );

          if (!r.ok) {
            addBubble(
              "This referral link is no longer available. You can still start a new conversation with me.",
              "them",
            );
            return;
          }

          const d = await r.json();
          leadId = d.lead_session_id;
          addBubble(d.greeting, "them");
          return;
        }

        const r = await fetch("/api/lead/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source_channel: "instagram_comment",
            context: "your inquiry",
          }),
        });

        const d = await r.json();
        leadId = d.lead_session_id;
        addBubble(d.greeting, "them");
      })();

      async function askTrust() {
        addBubble("Are you a real doctor?", "me");
        const r = await fetch(`/api/lead/${leadId}/message`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: "Are you a real doctor?" }),
        });
        const d = await r.json();
        addBubble(d.reply, "them");
      }

      async function sendMsg() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (!text) return;

        addBubble(text, "me");
        input.value = "";

        //const isHighRisk =
        //  /chest pain|difficulty breathing|can't breathe|heavy bleeding|bleeding heavily|hurt myself|kill myself|suicide/i.test(
        //    text,
        //  );

        if (
          !patientToken ||
          !patientSessionId ||
          patientToken === "undefined" ||
          patientSessionId === "undefined"
        ) {
          // Guest / authentication not established yet
          const r = await fetch(`/api/lead/${leadId}/message`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });

          const d = await r.json();
          addBubble(
            d.reply || "I want to make sure the right person sees this.",
            "them",
          );

          // SHOW ESCALATION STATUS FOR HIGH-RISK MESSAGE
          if (d.escalation_required) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "escalate-btn";
            btn.textContent = "Sent to Nurse/Clinic";
            btn.disabled = true;
            document.getElementById("thread").appendChild(btn);
          }

          if (d.value_event === "education") {
            maybeOfferSignup();
          }
        } else {
          const r = await fetch(`/api/patient/${patientSessionId}/message`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + patientToken,
            },
            body: JSON.stringify({ message: text }),
          });

          const d = await r.json();

          if (d.error) {
            console.error("PATIENT MESSAGE ERROR:", d);
            addBubble(
              "I couldn't connect your secure session. Please log in again.",
              "them",
            );
            return;
          }

          addBubble(
            d.reply,
            "them",
            `risk: ${d.risk_level} (${d.confidence} confidence) — ${d.risk_reason}`,
            d.citation,
          );

          lastTrigger = d.triggering_message_id;

          if (d.escalation_required) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "escalate-btn";
            btn.textContent = "Send to Nurse/Clinic";
            btn.onclick = sendEscalation;
            document.getElementById("thread").appendChild(btn);
          }

          loadProfile();
        }
      }

      let signupOffered = false;
      function maybeOfferSignup() {
        if (signupOffered) return;
        signupOffered = true;
        const t = document.getElementById("thread");
        const card = document.createElement("div");
        card.className = "signupCard";
        card.innerHTML = `Want me to email you a summary of this conversation plus 6 questions people often forget to ask the doctor?<br>
          <input id="su_email" placeholder="email"><input id="su_phone" placeholder="phone">
          <input id="su_pass" placeholder="create a password" type="password">
          <label style="font-size:12px; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="su_marketing">
            <span style="white-space:nowrap;">Also send me occasional clinic updates</span>
          </label>
          <label>
            <input id="su_healthcare_consent" type="checkbox">
            I consent to share the healthcare information I provide with the clinic so they can respond to my enquiry.
          </label>
          <button type="button" onclick="patientLogin()" style="margin-top:8px; background:#fff; color:var(--sage); border:1px solid var(--sage);">
            Already have an account? Log in
          </button>
          <button onclick="doSignup()">Continue securely to send this to the clinic</button>`;
        t.appendChild(card);
      }
      async function patientLogin() {
        const email = prompt("Enter your account email:");
        if (!email) return;

        const password = prompt("Enter your password:");
        if (!password) return;

        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const d = await r.json();

        if (!r.ok || !d.token || d.role !== "patient") {
          addBubble(
            d.error ||
              "Unable to log in. Please check your email and password.",
            "them",
          );
          return;
        }

        patientToken = d.token;
        patientSessionId = d.patient_session_id;

        localStorage.setItem("nightingale_patient_token", patientToken);
        localStorage.setItem(
          "nightingale_patient_session_id",
          patientSessionId,
        );

        document.getElementById("profileToggle").style.display = "block";

        addBubble(
          "You're verified — your profile is ready. Let's continue from where you left off.",
          "them",
        );

        loadProfile();
      }
      async function doSignup() {
        const body = {
          lead_session_id: leadId,
          email: document.getElementById("su_email").value,
          phone: document.getElementById("su_phone").value,
          password: document.getElementById("su_pass").value,
          marketing_consent: document.getElementById("su_marketing").checked,
          healthcare_consent: document.getElementById("su_healthcare_consent")
            .checked,
        };
        const r = await fetch("/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const err = await r.json();
          addBubble(
            err.error || "We couldn't complete signup. Please try again.",
            "them",
          );
          return;
        }
        const d = await r.json();
        console.log("SIGNUP RESPONSE:", d);
        patientToken = d.token;
        localStorage.setItem("nightingale_patient_token", patientToken);
        patientSessionId = d.patient_session_id;
        localStorage.setItem(
          "nightingale_patient_session_id",
          patientSessionId,
        );
        document.getElementById("profileToggle").style.display = "block";
        addBubble(
          "You're verified — everything you told me is already in your profile. Let's continue.",
          "them",
        );
        loadProfile();
      }

      function toggleDrawer() {
        document.getElementById("drawer").classList.toggle("open");
      }
      async function loadProfile() {
        const r = await fetch(`/api/patient/${patientSessionId}/profile`, {
          headers: { Authorization: "Bearer " + patientToken },
        });
        const items = await r.json();
        const box = document.getElementById("factList");
        box.innerHTML = "";
        items.forEach((i) => {
          const d = document.createElement("div");
          d.className = "fact";
          d.innerHTML = `<b>${i.fact_type}</b>: ${i.value} <span class="status">${i.status}</span>`;
          box.appendChild(d);
        });
      }

      async function sendEscalation() {
        const r = await fetch(`/api/patient/${patientSessionId}/escalate`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + patientToken,
          },
          body: JSON.stringify({ triggering_message_id: lastTrigger }),
        });

        const d = await r.json();

        if (!r.ok) {
          addBubble(
            d.error || "I couldn't send this to the clinic. Please try again.",
            "them",
          );
          return;
        }

        addBubble(
          `Sent to the clinic. Expected response: ${d.expected_response}. You can keep chatting with me in the meantime.`,
          "them",
        );
      }
      async function staffLogin() {
        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("staffName").value,
            password: document.getElementById("staffPass").value,
          }),
        });
        const d = await r.json();
        if (d.token) {
          staffToken = d.token;
          loadWarmLeads();
        }
      }
      async function loadWarmLeads() {
        const r = await fetch("/api/staff/warm-leads", {
          headers: { Authorization: "Bearer " + staffToken },
        });
        const d = await r.json();
        document.getElementById("compassionBox").innerHTML =
          '<section class="staff-section compassion-section">' +
          '<div class="section-heading">' +
          "<h3>Compassion priority</h3>" +
          "<span>Clinical concerns</span>" +
          "</div>" +
          '<p class="section-note">These cases are surfaced separately and are never sales-ranked.</p>' +
          (d.compassion_priority_queue
            .map(
              (
                c,
              ) => `<div class="leadrow compassion-row" id="row_${c.escalation_id}">
                <span>${
                  Array.isArray(c.summary)
                    ? c.summary.join("; ")
                    : c.summary?.risk_reason ||
                      "Clinical concern requires review"
                }</span>
                <button onclick="viewEscalation('${c.escalation_id}')">View case</button>
              </div>`,
            )
            .join("") || '<p class="empty-state">None pending</p>') +
          "</section>";
        document.getElementById("leadsBox").innerHTML =
          '<section class="staff-section warm-leads-section">' +
          '<div class="section-heading">' +
          "<h3>Warm leads</h3>" +
          "<span>Follow-up opportunities</span>" +
          "</div>" +
          (d.warm_leads
            .map(
              (l) =>
                `<div class="leadrow">
                  <span>${l.channel} — ${l.top_concern || ""}</span>
                  <b>${l.score}</b>
                </div>`,
            )
            .join("") || '<p class="empty-state">No warm leads yet</p>') +
          "</section>";
      }
      async function viewEscalation(escId) {
        const existing = document.getElementById(`detail_${escId}`);
        if (existing) {
          existing.remove();
          return;
        }
        const r = await fetch(`/api/staff/escalation/${escId}`, {
          headers: { Authorization: "Bearer " + staffToken },
        });
        const d = await r.json();
        if (!r.ok) {
          alert(d.error || "Unable to load case.");
          return;
        }

        const t = d.triage_summary;
        const panel = document.createElement("div");
        panel.id = `detail_${escId}`;
        panel.className = "case-detail";
        panel.innerHTML = `
          <p><b>Risk:</b> ${t.risk_level} (${t.confidence} confidence) — ${t.risk_reason}</p>
          <p><b>Message:</b> ${d.triggering_message ? d.triggering_message.content_redacted : "(not found)"}</p>
          <p><b>Source:</b> ${d.attribution_snapshot.source_channel || "unknown"} ${d.attribution_snapshot.campaign_id ? "/ " + d.attribution_snapshot.campaign_id : ""}</p>
          <textarea id="resp_${escId}" placeholder="Clinician response"></textarea>
          <button onclick="submitResponse('${escId}')">Submit response</button>
        `;
        document
          .getElementById(`row_${escId}`)
          .insertAdjacentElement("afterend", panel);
      }

      async function submitResponse(escId) {
        const text = document.getElementById(`resp_${escId}`).value.trim();
        if (!text) return;
        const r = await fetch(`/api/staff/escalation/${escId}/respond`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + staffToken,
          },
          body: JSON.stringify({ response: text }),
        });
        const d = await r.json();
        if (!r.ok) {
          alert(d.error || "Unable to respond to escalation.");
          return;
        }
        loadWarmLeads();
      }
    </script>
  </body>
</html>
